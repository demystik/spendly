name: spendly
description: "A spending habit tracker"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  flutter_svg: ^2.3.0
  lucide_icons_flutter: ^3.1.13
  intl: ^0.20.2
  uuid: ^4.5.3
  provider: ^6.1.5+1
  fl_chart: ^1.2.0
  drift: ^2.33.0
  drift_flutter: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/logos/
    - assets/animations/
    - assets/icons/

