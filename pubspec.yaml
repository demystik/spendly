name: spendly
description: "A spending habit tracker"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  flutter_svg: ^2.3.0
  lucide_icons_flutter: ^3.1.13
  intl: ^0.20.2
  uuid: ^4.5.3
  provider: ^6.1.5+1
  fl_chart: ^1.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  google_sign_in: 6.2.1
  flutter_native_splash: 2.4.7
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/logos/
    - assets/animations/
    - assets/icons/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logos/flutter_native_splash_logo.png
  

  color_dark: "#121212"
  image_dark: assets/logos/flutter_native_splash_logo.png

  android: true
  ios: true

  android_12:
    color: "#FFFFFF"
    image: assets/logos/flutter_native_splash_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/spendly_launcher_logo.png"
  min_sdk_android: 21